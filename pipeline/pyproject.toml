[project]
name = "pipeline"
version = "0.0.0"
description = "Scrapers, parsers and loaders for oddsbeater."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff==0.16.8",
]

[tool.ruff.lint]
# sort imports
extend-select = ["I"]

[tool.mypy]
files = ["."]
strict = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
